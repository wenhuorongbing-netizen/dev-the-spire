name: Spire Plus Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "forum/**"
      - ".github/workflows/spire-plus-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spire-plus-site
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: forum/package-lock.json

      - name: Build forum
        working-directory: forum
        env:
          VITE_SUPABASE_URL: ${{ vars.SPIRE_PLUS_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SPIRE_PLUS_SUPABASE_ANON_KEY }}
          VITE_FORUM_READ_ONLY: ${{ vars.SPIRE_PLUS_FORUM_READ_ONLY }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
