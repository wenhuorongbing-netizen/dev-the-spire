services:
  postgres:
    image: postgres:16-alpine
    container_name: spire-plus-forum-postgres
    environment:
      POSTGRES_DB: forum
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: forum
    ports:
      - "54329:5432"
    volumes:
      - forum-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum -d forum"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forum-postgres-data:
