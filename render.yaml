services:
  - type: web
    name: spire-plus-forum
    runtime: node
    plan: free
    rootDir: .
    buildCommand: cd forum && npm ci && npm run build
    startCommand: cd forum && npm run migrate && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spire-plus-forum-db
          property: connectionString
      - key: IP_HASH_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://wenhuorongbing-netizen.github.io,https://wenhuorongbing-netizen.github.io/dev-the-spire,https://spire-plus-forum.onrender.com
      - key: FORUM_READ_ONLY
        value: "0"

databases:
  - name: spire-plus-forum-db
    databaseName: spireplus_forum
    user: spireplus_forum
    plan: free
